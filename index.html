<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>計數器範例</title>
  <style>
    /* 針對淺色模式 (Light Mode) */
    @media (prefers-color-scheme: light) {
      body {
        background-color: #fff; /* 白底 */
        color: #000;           /* 黑字 */
      }
    }

    /* 針對深色模式 (Dark Mode) */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #333; /* 深灰底 */
        color: #fff;           /* 白字 */
      }
    }

    /* 
      讓容器使用 Inline-Flex 並在垂直方向置中 
      (與計數器圖片垂直對齊)
    */
    .counter-container {
      display: inline-flex;
      align-items: center;
      line-height: 1;
    }

    /* 調整表格與圖片的預設行內樣式，避免垂直置中偏移 */
    .counter-table {
      margin-left: 5px;
    }
    .counter-table img {
      display: inline-block;
      vertical-align: middle;
      margin: 0;
      padding: 0;
      border: 0;
    }
  </style>
</head>
<body style="margin:0; text-align:center;">
  <div class="counter-container">
    <span>網站瀏覽人數:</span>
    <table border="0" cellspacing="0" cellpadding="0" class="counter-table">
      <tbody>
        <tr>
          <td>
            <a href="https://ctr.stylemap.co.jp/">
              <img
                src="https://www.f-counter.net/ani1/65/1737881630/"
                alt="免費計數器"
              />
            </a>
          </td>
          <td>
            <a href="https://ctr.stylemap.co.jp/">
              <img
                src="https://www.f-counter.net/ani2/65/1737881630/"
                alt="免費計數器"
              />
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
