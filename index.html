<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>計數器</title>
  <style>
    /* 不指定任何固定背景；改用 transparent 使其透出 Notion 背景 */
    body {
      margin: 0;
      text-align: center;
      background-color: transparent;
      /* 指定一個預設文字顏色(fallback)；若瀏覽器不支援 prefers-color-scheme */
      color: #000; /* 預設為黑字 */
    }

    /* 瀏覽器/系統為「深色模式」時，讓文字改成白色 */
    @media (prefers-color-scheme: dark) {
      body {
        color: #fff;
      }
    }

    /* 瀏覽器/系統為「淺色模式」時，讓文字改成黑色 (可省略，預設已是黑色) */
    @media (prefers-color-scheme: light) {
      body {
        color: #000;
      }
    }

    .counter-container {
      display: inline-flex;
      align-items: center;
      line-height: 1;
    }
    .counter-table {
      margin-left: 5px;
    }
    .counter-table img {
      display: inline-block;
      vertical-align: middle;
      margin: 0;
      padding: 0;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="counter-container">
    <span>網站瀏覽人數:</span>
    <table border="0" cellspacing="0" cellpadding="0" class="counter-table">
      <tbody>
        <tr>
          <td>
            <a href="https://ctr.stylemap.co.jp/">
              <img
                src="https://www.f-counter.net/ani1/65/1737881630/"
                alt="免費計數器"
              />
            </a>
          </td>
          <td>
            <a href="https://ctr.stylemap.co.jp/">
              <img
                src="https://www.f-counter.net/ani2/65/1737881630/"
                alt="免費計數器"
              />
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
