<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>計數器範例</title>

  <style>
    /*
      告訴瀏覽器我們支援 light & dark 模式，
      使瀏覽器能依偏好自動調整(含表單背景、文字顏色、捲軸樣式等)。
    */
    :root {
      color-scheme: light dark;
    }

    /* 
      使用者代理樣式(UA default)通常會給 body 白底 & 黑字，
      這裡改用 Canvas / CanvasText，可在深色模式時自動轉深色背景/白字
      (若瀏覽器支援)。
    */
    body {
      margin: 0;
      text-align: center;
      background-color: Canvas;     /* 由瀏覽器自動決定背景 */
      color: CanvasText;           /* 由瀏覽器自動決定文字色 */
    }

    .counter-container {
      display: inline-flex;
      align-items: center;
      line-height: 1;
    }

    .counter-table {
      margin-left: 5px;
    }
    .counter-table img {
      display: inline-block;
      vertical-align: middle;
      margin: 0;
      padding: 0;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="counter-container">
    <span>網站瀏覽人數:</span>
    <table border="0" cellspacing="0" cellpadding="0" class="counter-table">
      <tbody>
        <tr>
          <td>
            <a href="https://ctr.stylemap.co.jp/">
              <img
                src="https://www.f-counter.net/ani1/65/1737881630/"
                alt="免費計數器"
              />
            </a>
          </td>
          <td>
            <a href="https://ctr.stylemap.co.jp/">
              <img
                src="https://www.f-counter.net/ani2/65/1737881630/"
                alt="免費計數器"
              />
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
